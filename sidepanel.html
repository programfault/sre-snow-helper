<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SRE Helper</title>
  <link rel="stylesheet" href="sidepanel.css" />
</head>
<body>
  <header class="header">

      <div class="logo">S</div>
      <div class="brand-text">
        <h1>SRE Helper</h1>
        <span class="subtitle">ServiceNow</span>

    </div>

      <span class="monitor-status-dot off" id="monitorDot" title="Chat monitor: off"></span>

        </svg>
      </button>
    </div>
  </header>

  <!-- Pinned context strip: always visible right under the header, does not
       scroll with the content below. -->
  <div id="baseStrip"></div>

  <main class="content" id="content"></main>

  <script src="yaml-lite.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
